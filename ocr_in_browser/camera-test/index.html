<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skill Bill — Live Camera OCR</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 16px;
    }
    .camera-stage {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #222;
    }
    #camera {
      display: block;
      width: 100%;
      max-height: 65vh;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #222;
    }
    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    button {
      padding: 11px 14px;
      margin: 8px 6px 8px 0;
      font: inherit;
    }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 8px 0 14px;
    }
    .toggles label { display: inline-flex; gap: 7px; align-items: center; }
    #status { min-height: 1.5em; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: rgba(127,127,127,.14);
      padding: 12px;
      min-height: 90px;
      border-radius: 8px;
    }
    .hint { font-size: .9rem; opacity: .78; }
  </style>
</head>
<body>
  <h1>Skill Bill — Live Camera OCR</h1>
  <p id="status" role="status">Gotowe. Uruchom kamerę.</p>

  <div class="camera-stage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlay" aria-hidden="true"></canvas>
  </div>

  <div>
    <button id="startCamera">Włącz kamerę</button>
    <button id="toggleOcr" disabled>Uruchom OCR live</button>
    <button id="stopCamera" disabled>Zatrzymaj kamerę</button>
  </div>

  <h2>Warstwy nakładki</h2>
  <div class="toggles">
    <label><input type="checkbox" id="showRegions" checked> Obszary / wiersze</label>
    <label><input type="checkbox" id="showWords"> Słowa</label>
    <label><input type="checkbox" id="showSymbols" checked> Pojedyncze znaki</label>
  </div>
  <p class="hint">Ramki pokazują prostokątne obszary zwrócone przez OCR, a nie dokładny kontur atramentu każdego znaku.</p>

  <h2>Rozpoznany tekst</h2>
  <pre id="result">Tutaj pojawi się tekst z kamery.</pre>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById("camera");
    const overlay = document.getElementById("overlay");
    const overlayCtx = overlay.getContext("2d");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const startButton = document.getElementById("startCamera");
    const ocrButton = document.getElementById("toggleOcr");
    const stopButton = document.getElementById("stopCamera");
    const showRegions = document.getElementById("showRegions");
    const showWords = document.getElementById("showWords");
    const showSymbols = document.getElementById("showSymbols");

    // Off-screen canvas: each OCR job analyses a snapshot from the video.
    const frameCanvas = document.createElement("canvas");
    const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });

    let stream = null;
    let worker = null;
    let ocrRunning = false;
    let lastOcrData = null;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    startButton.addEventListener("click", startCamera);
    ocrButton.addEventListener("click", toggleOcr);
    stopButton.addEventListener("click", stopCamera);

    [showRegions, showWords, showSymbols].forEach(control => {
      control.addEventListener("change", () => drawOcrOverlay(lastOcrData));
    });

    window.addEventListener("resize", () => drawOcrOverlay(lastOcrData));

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Przeglądarka nie udostępnia API kamery. Sprawdź, czy strona działa przez HTTPS.");
        }

        status.textContent = "Oczekiwanie na zgodę i uruchamianie kamery…";
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        startButton.disabled = true;
        ocrButton.disabled = false;
        stopButton.disabled = false;
        status.textContent = "Kamera działa. Uruchom OCR live.";
      } catch (error) {
        status.textContent = "Błąd kamery: " + (error.message || error.name);
      }
    }

    function toggleOcr() {
      if (ocrRunning) {
        ocrRunning = false;
        ocrButton.textContent = "Uruchom OCR live";
        status.textContent = "Zatrzymywanie OCR…";
        return;
      }
      if (!stream) return;

      ocrRunning = true;
      ocrButton.textContent = "Zatrzymaj OCR live";
      runOcrLoop();
    }

    async function runOcrLoop() {
      try {
        if (!worker) {
          status.textContent = "Ładowanie silnika OCR i języka polskiego…";
          worker = await Tesseract.createWorker("pol");
        }

        while (ocrRunning && stream) {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            frameCanvas.width = video.videoWidth;
            frameCanvas.height = video.videoHeight;
            frameCtx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);

            status.textContent = "Rozpoznawanie tekstu i położenia znaków…";
            // Explicitly request block hierarchy, including word/symbol boxes.
            const { data } = await worker.recognize(frameCanvas, {}, { blocks: true });

            if (ocrRunning) {
              lastOcrData = data;
              result.textContent = data.text.trim() || "(Nie wykryto tekstu)";
              drawOcrOverlay(data);
              status.textContent = "OCR działa. Ramki odpowiadają ostatnio przeanalizowanej klatce.";
            }
          }
          // Avoid starting another job until this OCR job has finished.
          await sleep(350);
        }
      } catch (error) {
        status.textContent = "Błąd OCR: " + (error.message || error.name);
        ocrRunning = false;
      } finally {
        ocrButton.textContent = "Uruchom OCR live";
      }
    }

    function drawOcrOverlay(data) {
      const rect = video.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      overlay.width = Math.max(1, Math.round(rect.width * dpr));
      overlay.height = Math.max(1, Math.round(rect.height * dpr));

      overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (!data || !video.videoWidth || !video.videoHeight || !rect.width || !rect.height) return;

      // Match object-fit: contain, including any empty bars in the video element.
      const scale = Math.min(rect.width / video.videoWidth, rect.height / video.videoHeight);
      const offsetX = (rect.width - video.videoWidth * scale) / 2;
      const offsetY = (rect.height - video.videoHeight * scale) / 2;

      overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      overlayCtx.translate(offsetX, offsetY);
      overlayCtx.scale(scale, scale);

      const blockBoxes = [];
      const lineBoxes = [];
      const wordBoxes = [];
      const symbolBoxes = [];

      for (const block of (data.blocks || [])) {
        if (block.bbox) blockBoxes.push(block.bbox);
        for (const paragraph of (block.paragraphs || [])) {
          for (const line of (paragraph.lines || [])) {
            if (line.bbox) lineBoxes.push(line.bbox);
            for (const word of (line.words || [])) {
              if (word.bbox) wordBoxes.push(word.bbox);
              for (const symbol of (word.symbols || [])) {
                if (symbol.bbox) symbolBoxes.push(symbol.bbox);
              }
            }
          }
        }
      }

      const drawBoxes = (boxes, color, width, dash = []) => {
        overlayCtx.strokeStyle = color;
        overlayCtx.lineWidth = width / scale;
        overlayCtx.setLineDash(dash.map(n => n / scale));
        for (const box of boxes) {
          const x = box.x0, y = box.y0;
          const w = box.x1 - box.x0, h = box.y1 - box.y0;
          if (Number.isFinite(x) && Number.isFinite(y) && w > 0 && h > 0) {
            overlayCtx.strokeRect(x, y, w, h);
          }
        }
        overlayCtx.setLineDash([]);
      };

      if (showRegions.checked) {
        drawBoxes(blockBoxes, "#00e676", 3, [8, 4]);
        drawBoxes(lineBoxes, "#ffeb3b", 2);
      }
      if (showWords.checked) drawBoxes(wordBoxes, "#00e5ff", 1.8);
      if (showSymbols.checked) drawBoxes(symbolBoxes, "#ff4081", 1.3);
    }

    function stopCamera() {
      ocrRunning = false;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      lastOcrData = null;

      overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      result.textContent = "Tutaj pojawi się tekst z kamery.";
      startButton.disabled = false;
      ocrButton.disabled = true;
      stopButton.disabled = true;
      ocrButton.textContent = "Uruchom OCR live";
      status.textContent = "Kamera zatrzymana.";
    }
  </script>
</body>
</html>
