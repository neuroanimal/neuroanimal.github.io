
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skill Bill — Camera OCR Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      background: #222;
      border-radius: 10px;
    }

    button {
      padding: 12px;
      margin: 6px 4px 6px 0;
      font-size: 1rem;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f2f2f2;
      color: #111;
      padding: 12px;
      min-height: 100px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Skill Bill — Camera OCR Test</h1>
  <p id="status">Gotowe. Uruchom kamerę.</p>

  <video id="camera" autoplay playsinline muted></video>

  <button id="startCamera">Włącz kamerę</button>
  <button id="toggleOcr" disabled>Uruchom OCR live</button>
  <button id="stopCamera" disabled>Zatrzymaj kamerę</button>

  <h2>Rozpoznany tekst</h2>
  <pre id="result">Tutaj pojawi się tekst z kamery.</pre>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const startButton = document.getElementById("startCamera");
    const ocrButton = document.getElementById("toggleOcr");
    const stopButton = document.getElementById("stopCamera");

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    let stream = null;
    let worker = null;
    let ocrRunning = false;

    const sleep = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    startButton.addEventListener("click", startCamera);
    ocrButton.addEventListener("click", toggleOcr);
    stopButton.addEventListener("click", stopCamera);

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Przeglądarka nie udostępnia API kamery. Sprawdź HTTPS."
          );
        }

        status.textContent = "Oczekiwanie na zgodę i uruchamianie kamery...";

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        startButton.disabled = true;
        ocrButton.disabled = false;
        stopButton.disabled = false;
        status.textContent = "Kamera działa. Możesz uruchomić OCR.";
      } catch (error) {
        status.textContent =
          "Błąd kamery: " + (error.message || error.name);
      }
    }

    function toggleOcr() {
      if (ocrRunning) {
        ocrRunning = false;
        ocrButton.textContent = "Uruchom OCR live";
        status.textContent = "Zatrzymywanie OCR...";
        return;
      }

      if (!stream) return;

      ocrRunning = true;
      ocrButton.textContent = "Zatrzymaj OCR live";
      runOcrLoop();
    }

    async function runOcrLoop() {
      try {
        if (!worker) {
          status.textContent = "Ładowanie silnika OCR i języka polskiego...";
          worker = await Tesseract.createWorker("pol");
        }

        while (ocrRunning && stream) {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            status.textContent = "Rozpoznawanie tekstu z obrazu...";

            const { data } = await worker.recognize(canvas);

            if (ocrRunning) {
              result.textContent =
                data.text.trim() || "(Nie wykryto tekstu)";
              status.textContent = "OCR działa. Analizuję kolejną klatkę...";
            }
          }

          // Następna analiza rozpocznie się po zakończeniu
          // poprzedniej i krótkiej przerwie.
          await sleep(500);
        }
      } catch (error) {
        status.textContent =
          "Błąd OCR: " + (error.message || error.name);
        ocrRunning = false;
      } finally {
        ocrButton.textContent = "Uruchom OCR live";
      }
    }

    function stopCamera() {
      ocrRunning = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = null;
      video.srcObject = null;

      startButton.disabled = false;
      ocrButton.disabled = true;
      stopButton.disabled = true;
      ocrButton.textContent = "Uruchom OCR live";

      status.textContent = "Kamera zatrzymana.";
    }
  </script>
</body>
</html>
